    isi: `Santunan Anak Yatim dan Janda Warnai Peringatan HUT ke-43 Desa Marga Mulya

  {
    judul: "Memahami Desil 1 hingga Desil 10: Jangan Salah Mengartikan Status Kesejahteraan Keluarga",
    tanggal: "",
    kategori: "jakarta",
    foto: "https://raw.githubusercontent.com/Haris12342/LIPUTAN-KABARI-KAMI.INEWS/2f6d8528f9da0ca6f66bcf2c5e4620108a434d9e/Chek.desil.jpg",
    isi: `
JAKARTA — Istilah desil belakangan semakin sering dibicarakan masyarakat, terutama berkaitan dengan bantuan sosial dan pemutakhiran data kesejahteraan. Namun, masih banyak masyarakat yang menganggap desil sebagai ukuran sederhana yang hanya menentukan seseorang miskin atau kaya.

Padahal, dalam Data Tunggal Sosial dan Ekonomi Nasional (DTSEN), desil merupakan pengelompokan atau pemeringkatan relatif keluarga berdasarkan tingkat kesejahteraan sosial-ekonominya. Keluarga dibagi menjadi 10 kelompok, dengan Desil 1 berada pada kelompok kesejahteraan relatif paling rendah dan Desil 10 pada kelompok relatif paling tinggi.

Apa arti Desil 1 sampai Desil 10?

Desil 1 merupakan kelompok sekitar 10 persen keluarga dengan posisi kesejahteraan relatif paling rendah. Kelompok ini menjadi salah satu kelompok yang mendapat perhatian tinggi dalam berbagai program perlindungan sosial.

Desil 2 berada pada kelompok kesejahteraan sekitar 10–20 persen terbawah.

Desil 3 berada pada kelompok sekitar 20–30 persen terbawah.

Desil 4 berada pada kelompok sekitar 30–40 persen terbawah.

Desil 5 berada di kelompok tengah, sedangkan Desil 6 sampai Desil 10 menunjukkan posisi kesejahteraan relatif yang semakin tinggi dalam pemeringkatan tersebut.

Dengan demikian, semakin besar angka desil, secara umum menunjukkan posisi kesejahteraan relatif yang semakin tinggi dibandingkan kelompok lainnya. Namun, Desil 10 tidak otomatis berarti seseorang “orang kaya raya”, sebagaimana Desil 1 juga tidak semata-mata dapat disimpulkan hanya berdasarkan jumlah penghasilan.

Bagaimana desil ditentukan?

Penentuan desil tidak hanya melihat gaji atau penghasilan seseorang. BPS menjelaskan bahwa pemeringkatan mempertimbangkan berbagai karakteristik sosial dan ekonomi secara bersama-sama.

Di antaranya meliputi kondisi rumah, sumber air minum, bahan bakar dan energi untuk memasak, kepemilikan aset, daya dan konsumsi listrik, komposisi keluarga, pendidikan, pekerjaan, kesehatan, disabilitas, serta karakteristik sosial ekonomi lainnya.

Artinya, seseorang yang mempunyai penghasilan tertentu belum tentu otomatis masuk desil tertentu. Begitu pula kepemilikan satu barang, kendaraan, rumah, atau penggunaan listrik saja tidak dapat menjadi satu-satunya dasar menentukan desil.

Mengapa desil penting bagi masyarakat?

Data desil digunakan pemerintah sebagai salah satu dasar untuk menentukan sasaran dan prioritas berbagai program, termasuk program perlindungan sosial. Namun, desil bukan berarti daftar otomatis penerima bantuan. Setiap program memiliki kriteria dan ketentuan masing-masing.

Karena kondisi ekonomi keluarga dapat berubah, posisi desil juga dapat berubah setelah data diperbarui. Oleh sebab itu, masyarakat perlu memastikan data kependudukan dan kondisi sosial ekonominya tercatat sesuai keadaan sebenarnya.

    isi: `

Cara Mengecek Desil

Masyarakat dapat mengikuti langkah berikut:

1. Buka laman resmi Cek Bansos Kemensos

Akses Cek Bansos Kemensos RI melalui telepon genggam atau komputer.

2. Siapkan NIK

Masukkan 16 digit Nomor Induk Kependudukan (NIK) sesuai yang tercantum pada KTP.

3. Masukkan kode keamanan

Ketik huruf atau kode yang ditampilkan pada kolom yang tersedia. Apabila kode kurang jelas, dapat menggunakan tombol untuk memperbarui kode.

4. Klik “CARI DATA”

Setelah NIK dan kode keamanan dimasukkan dengan benar, tekan CARI DATA. Sistem akan menampilkan informasi yang tersedia berdasarkan data DTSEN.

5. Perhatikan informasi

Apabila data desil tersedia, masyarakat dapat melihat posisi kesejahteraan keluarganya. Perlu dipahami bahwa desil merupakan peringkat relatif, bukan label permanen bahwa seseorang “miskin” atau “kaya”.

Mari cek data kita sendiri, pastikan sesuai kondisi sebenarnya, dan jangan mudah percaya informasi yang belum berasal dari sumber resmi pemerintah.

Wajah Bahagia Warga Mekar Baru, Akhirnya Nikmati Air Bersih Gratis, Ian Mulyana dan Hidayatullah Turun Tangan

MEKAR BARU, KABUPATEN TANGERANG – Kebahagiaan terpancar dari wajah warga Kecamatan Mekar Baru, Kabupaten Tangerang. Pasalnya, krisis air bersih yang selama ini dirasakan masyarakat kini mendapat penanganan melalui penyaluran air bersih gratis dari anggota DPRD Kabupaten Tangerang Daerah Pemilihan (Dapil) II, Ian Mulyana, S.Kom. dan Hidayatullah dari Fraksi Partai Keadilan Sejahtera (PKS).

“Alhamdulillah senang sekali, sudah dua bulan air sumur kami kekeringan. Mau mandi susah, mau masak, nyuci piring, nyuci baju juga susah karena tidak ada air. Terima kasih Pak Dewan Ian Mulyana dan Hidayatullah yang sudah peduli sama kami warga kecil. Airnya jernih dan gratis, sangat membantu,” ujarnya dengan wajah haru, Rabu (28/10/2026).

/* =========================================================
   ★★ PARSER TOLERAN — PERBAIKI OTOMATIS KESALAHAN KETIK ★★
   Kalau blok data berita ada koma hilang / backtick tak
   tertutup / kurung kurang, berita TETAP DISELAMATKAN.
   ========================================================= */
function bacaField(chunk, field){
  try{
    const re = new RegExp('(?:^|[\\n\\r;,{}\\s])'+field+'\\s*[:=]\\s*','i');
    const m = chunk.match(re);
    if(!m) return '';
    let rest = chunk.slice(m.index + m[0].length).replace(/^[ \t]+/,'');
    const q = rest.charAt(0);
    if(q === '`' || q === '"' || q === "'"){
      const close = rest.indexOf(q, 1);
      if(close !== -1) return rest.slice(1, close).trim();
      /* nilai tidak ditutup → selamatkan sampai sebelum penutup objek */
      let v = rest.slice(1);
      v = v.replace(/[{}\[\];,\s]+$/g, '');
      return v.trim();
    }
    const nl = rest.search(/[\n\r}]/);
    return (nl === -1 ? rest : rest.slice(0, nl)).trim();
  }catch(e){ return ''; }
}
function parseBeritaToleran(raw){
  try{
    if(!raw) return [];
    const items = [];
    const re = /judul\s*[:=]/gi;
    const pos = [];
    let m;
    while((m = re.exec(raw)) !== null){ pos.push(m.index); }
    for(let p=0;p<pos.length;p++){
      const chunk = raw.slice(pos[p], p+1<pos.length ? pos[p+1] : raw.length);
      const it = {
        judul: bacaField(chunk,'judul'),
        tanggal: bacaField(chunk,'tanggal'),
        kategori: bacaField(chunk,'kategori'),
        foto: bacaField(chunk,'foto'),
        isi: bacaField(chunk,'isi')
      };
      if(it.judul) items.push(it);
    }
    return items;
  }catch(e){ return []; }
}

function matchTopic(title, deck, category){
  const text = ((category||'')+' '+(title||'')+' '+(deck||'')).toLowerCase();
  for(const [topic, words] of TOPIC_KEYWORDS){ if(words.some(w=>text.includes(w))) return topic; }
  const catMap = {'Olahraga':'Olahraga','Politik':'Politik','Ekonomi':'Ekonomi','Kesehatan':'Kesehatan','Pendidikan':'Pendidikan','Teknologi':'Teknologi','Lingkungan':'Lingkungan','Hukum':'Hukum','Gaya Hidup':'GayaHidup','Berita Desa':'Desa','Peristiwa':'Kota','Daerah':'Desa','Nasional':'Umum'};
  return catMap[category] || 'Umum';
}
function pickTopicPhoto(title, deck, category, seed){
  const topic = matchTopic(title, deck, category);
  const pool = TOPIC_PHOTOS[topic] || TOPIC_PHOTOS.Umum;
  const s = String(seed||title||'x');
  let h=0; for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))>>>0; }
  return pool[h % pool.length];
}
function netPhoto(seed){ return 'https://picsum.photos/seed/'+encodeURIComponent(seed)+'/900/500'; }

/* Foto lokal dari folder yang sama */
function fotoPath(f){
  /* Bersihkan karakter tak terlihat (sering ikut ter-copy dari WhatsApp/chat)
     yang membuat URL foto menjadi 404 — URL "sedikit kotor" tetap berfungsi. */
  let s = String(f||'');
  s = s.replace(/[\u200B-\u200F\u2060-\u2064\uFEFF\u00AD\u180E\u202A-\u202E\u2066-\u206F]/g,'');
  s = s.replace(/%E2%80%8B|%E2%80%8C|%E2%80%8D|%E2%81%A0|%EF%BB%BF|%C2%AD|%E2%80%AE/gi,'');
  s = s.trim().replace(/[\t\r\n]+/g,'').replace(/ +/g,'%20');
  if(!s) return '';
  if(/^https?:\/\//i.test(s)) return s;
  if(s.indexOf('/') === 0 || s.indexOf('./') === 0) return s;
  return s.replace(/ /g, '%20');
}

function tanggalIndoPendek(s){
  try{
    if(!s) return '';
    const d = new Date(s);
    if(isNaN(d.getTime())) return '';
    return d.toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
  }catch(e){ return ''; }
}
function parseTanggalIndo(str){
  if(!str) return new Date().toISOString();
  const m = String(str).trim().match(/^(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})$/);
  if(m && BULAN_INDO[m[2].toLowerCase()]!==undefined){
    const d = new Date(Number(m[3]), BULAN_INDO[m[2].toLowerCase()], Number(m[1]), 8, 0);
    if(!isNaN(d)) return d.toISOString();
  }
  const d = new Date(str);
  return isNaN(d) ? new Date().toISOString() : d.toISOString();
}

/* Konversi item berita — dijaga agar item rusak pun tidak menjatuhkan aplikasi */
function convertBerita(item,i){
  if(!item) return null;
  const judul = String(item.judul||item.title||'').trim();
  if(!judul) return null;
  const content = String(item.isi||'').trim() || judul;
  const kalimat = content.replace(/\n+/g,' ').split('.').map(s=>s.trim()).filter(Boolean);
  const det = detectRegionAndCategory(judul, content);
  return {
    id:'seed-'+(i+1),
    title:judul,
    slug:judul.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''),
    deck:kalimat[0]?kalimat[0]+'.':judul,
    content:content,
    keyTakeaways:kalimat.slice(0,3),
    category:String(item.kategori||'Daerah').trim()||'Daerah',
    tags:(item.kategori?[String(item.kategori).trim()]:[]).filter(Boolean),
    prov:det.prov, kota:det.kota||'', pulau:det.island,

    publishedAt:parseTanggalIndo(item.tanggal),

}

function detectRegionAndCategory(title,content){
  const text = (title+' '+(content||'')).toLowerCase();
  const rules = [
    ['Politik',['politik','pemilu','pilkada','dpr','presiden','partai','kpu','bawaslu']],
    ['Ekonomi',['ekonomi','bisnis','investasi','rupiah','pasar','perbankan','umkm']],
    ['Teknologi',['teknologi','digital','internet','aplikasi','ai','startup']],
    ['Hukum',['hukum','pengadilan','polisi','kejaksaan','kasus','tersangka','pidana']],
    ['Pendidikan',['pendidikan','sekolah','kampus','guru','siswa','universitas']],
    ['Kesehatan',['kesehatan','rumah sakit','dokter','obat','penyakit']],
    ['Olahraga',['olahraga','sepak bola','bola','badminton','basket','atlet']],
    ['Gaya Hidup',['gaya hidup','kuliner','wisata','fashion','hiburan']],
    ['Lingkungan',['lingkungan','banjir','sampah','hutan','cuaca','iklim']]
  ];
  let category='Nasional';
  for(const [cat,words] of rules){ if(words.some(w=>text.includes(w))){category=cat;break;} }
  for(const [isl,provinces] of Object.entries(INDONESIA_ISLANDS)){
    for(const p of provinces){ if(text.includes(p.toLowerCase())) return {prov:p,island:isl,category}; }
  }
  const aliases=[
    ['Tangerang','Banten','Jawa'],['Serang','Banten','Jawa'],['Pandeglang','Banten','Jawa'],
    ['Lebak','Banten','Jawa'],['Bandung','Jawa Barat','Jawa'],['Bekasi','Jawa Barat','Jawa'],
    ['Bogor','Jawa Barat','Jawa'],['Depok','Jawa Barat','Jawa'],['Semarang','Jawa Tengah','Jawa'],
    ['Surabaya','Jawa Timur','Jawa'],['Yogyakarta','DI Yogyakarta','Jawa'],['Jakarta','DKI Jakarta','Jawa'],
    ['Medan','Sumatera Utara','Sumatra'],['Makassar','Sulawesi Selatan','Sulawesi'],['Denpasar','Bali','Bali & Nusa Tenggara'],
    ['Gunung Sari','Banten','Jawa'],['Mauk','Banten','Jawa']
  ];
  for(const [city,p,isl] of aliases){ if(text.includes(city.toLowerCase())) return {prov:p,island:isl,kota:city,category}; }
  return {prov:'Nasional',island:'Nasional',category};
}

function hoursAgo(h){ return new Date(Date.now()-h*3600000).toISOString(); }
function hashStr(s){ let h=0; const t=String(s); for(let i=0;i<t.length;i++){ h=(h*31+t.charCodeAt(i))>>>0; } return h; }
function hashId(str){ return 'real-'+hashStr(str); }
function stripHtml(html){ const d=document.createElement('div'); d.innerHTML=html||''; return (d.textContent||'').replace(/\s+/g,' ').trim(); }
function extractImage(item){
  if(item.thumbnail) return item.thumbnail;
  if(item.enclosure && item.enclosure.link && /\.(jpg|jpeg|png|webp|gif)/i.test(item.enclosure.link)) return item.enclosure.link;
  const html = (item.content||'') + ' ' + (item.description||'');
  const m = html.match(/<img[^>]+src=["']([^"']+)["']/i);
  if(m && m[1].indexOf('news.google.com')===-1) return m[1];
  const m2 = html.match(/https?:\/\/[^\s"'<>]+\.(?:jpg|jpeg|png|webp)/i);
  if(m2 && m2[0].indexOf('news.google.com')===-1) return m2[0];
  return '';
}
function formatViews(n){ return (n||0).toLocaleString('id-ID'); }

function baseStats(id){
  const h = hashStr(id);
  const views = 900 + (h % 15000);
  const likes = Math.max(12, Math.floor(views * (0.018 + ((h>>3) % 40)/1000)));
  const comments = 2 + ((h>>6) % 35);
  const shares = Math.max(4, Math.floor(likes * 0.25));
  return {views, likes, comments, shares};
}

/* ===== STORAGE v19 ===== */
const STORAGE = { articles:'inw_v19_articles', real:'inw_v19_real', bookmarks:'inw_v19_bookmarks', notifications:'inw_v19_notif', likes:'inw_v19_likes', engagement:'inw_v19_engagement', seedSync:'inw_v19_seedsync' };
function loadStorage(key,fallback){
  try{ const c=localStorage.getItem(key); if(c) return JSON.parse(c); }catch(e){}
  return fallback;
}
function saveStorage(key,value){ try{ localStorage.setItem(key,JSON.stringify(value)); }catch(e){} }
function safeGetSession(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } }
function safeSetSession(k,v){ try{ if(v) sessionStorage.setItem(k,v); else sessionStorage.removeItem(k); }catch(e){} }

function syncSeedsWithStorage(){
  const stored = loadStorage(STORAGE.articles, null);
  if(!stored || !Array.isArray(stored) || !stored.length){
    saveStorage(STORAGE.seedSync, SEED_FINGERPRINT);
    return { list: DEFAULT_ARTICLES, added: 0 };
  }
  const prevFp = loadStorage(STORAGE.seedSync, null);
  const fpChanged = prevFp !== SEED_FINGERPRINT;
  let list = stored.slice();
  let added = 0;
  SEED_ARTICLES.forEach(seed => {
    const idx = list.findIndex(a => a.id === seed.id);
    if(idx === -1){ list.push(seed); added++; }
    else if(fpChanged){
      list[idx] = Object.assign({}, list[idx], {
        title:seed.title, slug:seed.slug, deck:seed.deck, content:seed.content,
        keyTakeaways:seed.keyTakeaways, category:seed.category, tags:seed.tags,
        prov:seed.prov, kota:seed.kota, pulau:seed.pulau,
        publishedAt:seed.publishedAt, readingTime:seed.readingTime, image:seed.image,
        author:seed.author
      });
    }
  });
  list = list.filter(a => !(a.id && String(a.id).indexOf('seed-')===0 && !SEED_IDS.has(a.id)));
  /* MIGRASI NAMA REDAKSI: semua artikel internal dipaksa pakai nama redaksi
     terbaru (menghapus sisa nama redaksi versi lama yang menempel di
     localStorage browser), artikel RSS/external tetap memakai nama sumber aslinya. */
  list.forEach(a=>{ if(a && !a.external && String(a.author||'') !== SITE_AUTHOR) a.author = SITE_AUTHOR; });
  saveStorage(STORAGE.seedSync, SEED_FINGERPRINT);
  return { list, added };
}

function SafeImg(props){
  const chain = [...new Set([props.src, props.fallback, props.net].filter(Boolean))];
  if(!chain.length) return null;
  return (
    <img src={chain[0]} alt={props.alt||''} loading="lazy"
      referrerPolicy="no-referrer"
      className={props.className}
      onError={e=>{
        const t=e.currentTarget;
        const i = Number(t.dataset.i||0) + 1;
        if(i < chain.length && chain[i] !== t.getAttribute('src')){
          t.dataset.i = String(i);
          t.src = chain[i];
        } else { t.style.display='none'; }
      }} />
  );
}

}

function situsLink(){
  try{
    if(window.location.protocol==='http:'||window.location.protocol==='https:'){
      return window.location.origin + '/';
    }
  }catch(e){}
  return 'https://liputan-kabar-kami-inewscom.vercel.app/';
}
function shareSitus(platform){
  const url = situsLink();
  const text = SITE_NAME + ' — Portal Berita Nusantara';
  const enc = encodeURIComponent;
  if(platform==='wa'){ window.open('https://wa.me/?text='+enc(text+'\n'+url),'_blank','noopener'); }
  else if(platform==='fb'){ window.open('https://www.facebook.com/sharer/sharer.php?u='+enc(url),'_blank','noopener'); }
  else if(platform==='x'){ window.open('https://twitter.com/intent/tweet?text='+enc(text)+'&url='+enc(url),'_blank','noopener'); }
  else if(platform==='tg'){ window.open('https://t.me/share/url?url='+enc(url)+'&text='+enc(text),'_blank','noopener'); }
  else if(platform==='ig'){
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(()=>alert('Link website disalin!\n\nBuka Instagram, lalu tempel di story, caption, atau bio kamu.')).catch(()=>alert(url)); }
    else alert(url);
  }
  else if(platform==='copy'){
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(()=>alert('Link website berhasil disalin!')).catch(()=>alert(url)); }
    else alert(url);
  }
  else if(navigator.share){ navigator.share({title:SITE_NAME,text:text,url:url}).catch(()=>{}); }
}

function IklanBox(){
  const ref = React.useRef(null);
  const [hasAd,setHasAd] = React.useState(null); /* null = sedang dicek, kotak tetap dirender */
  React.useEffect(()=>{
    let tries=0;
    const tick=()=>{
      tries++;
      try{
        const src=document.getElementById('iklan-sumber');
        const dst=ref.current;
        if(src&&dst&&src!==dst&&src.childNodes.length&&!dst.childNodes.length){
          while(src.firstChild){ dst.appendChild(src.firstChild); }
        }
      }catch(e){}
      const ok = !!(ref.current && ref.current.querySelectorAll('iframe,ins,img').length);
      if(ok||tries>=20){ setHasAd(ok); return; }
      setTimeout(tick,300);
    };
    tick();
  },[]);
  if(hasAd===false) return null; /* sembunyikan hanya bila dipastikan tidak ada iklan */
  return (
    <div className="w-full max-w-[336px] mx-auto">
      <div className="text-center text-[9px] font-black uppercase tracking-widest text-inklight mb-1.5">Iklan</div>
      <div ref={ref} className="ad-slot bg-white border border-mistDark rounded-2xl overflow-hidden flex items-center justify-center"></div>
    </div>
  );
}

  /* ===== MESIN BERITA OTOMATIS (dipercaya + tahan gagal) =====
     Tiap feed dicoba lewat RANTAI 5 JEMBATAN secara berurutan:
     1. rss2json  2. allorigins raw (XML)  3. allorigins get (JSON bungkus XML)
     4. cors.eu.org (XML)  5. codetabs (XML)
     Kalau satu jembatan mati/diblokir, otomatis pindah ke berikutnya,
     jadi berita CNN Indonesia, Detik, ANTARA, Kompas dll tetap masuk. */
  function fetchWithTimeout(url, ms){
    try{
      const ctrl = (typeof AbortController!=='undefined') ? new AbortController() : null;
      if(!ctrl){
        return Promise.race([fetch(url).catch(()=>null), new Promise(r=>setTimeout(()=>r(null), ms||12000))]);
      }
      const t = setTimeout(()=>{ try{ ctrl.abort(); }catch(e){} }, ms||12000);
      return fetch(url, {signal:ctrl.signal}).finally(()=>clearTimeout(t));
    }catch(e){ return Promise.resolve(null); }
  }

  function parseRssXml(xmlText){
    /* Jalur 1: DOMParser ketat. Feed terpotong di Chrome masih menyisakan
       item yang utuh sebelum titik potong — semuanya tetap dipakai. */
    let viaParser = null;
    try{
      const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
      const hasErr = doc.getElementsByTagName('parsererror').length>0;
      const nodes = rssNodes(doc);
      if(nodes.length) viaParser = rssNodeToItems(nodes);
      if(!hasErr && viaParser) return viaParser;
    }catch(e){}
    if(viaParser && viaParser.length) return viaParser; /* feed terpotong: item sebelum titik potong tetap valid */
    /* Jalur 2: bersihkan karakter rusak (mis. & telanjang) lalu parse ulang */
    try{
      const clean = xmlText
        .replace(/&(?!(?:amp|lt|gt|quot|apos|#\d+|#x[0-9a-fA-F]+);)/g,'&amp;')
        .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
      const doc2 = new DOMParser().parseFromString(clean, 'text/xml');
      if(!doc2.getElementsByTagName('parsererror').length){
        const nodes2 = rssNodes(doc2);
        if(nodes2.length) return rssNodeToItems(nodes2);
      }
    }catch(e){}
    /* Jalur 3: cadangan regex — tahan XML terpotong/rusak di semua browser */
    return parseRssRegex(xmlText);
  }

  function rssNodes(doc){
    const nodes = [];
    const rssItems = doc.getElementsByTagName('item');
    for(let i=0;i<rssItems.length;i++) nodes.push(rssItems[i]);
    const entries = doc.getElementsByTagName('entry');
    for(let i=0;i<entries.length;i++) nodes.push(entries[i]);
    return nodes.slice(0,40);
  }

  function rssNodeToItems(nodes){
    return nodes.map(node=>{
      const txt = (names)=>{ for(let j=0;j<names.length;j++){ const els=node.getElementsByTagName(names[j]); if(els && els.length && els[0].textContent) return els[0].textContent.trim(); } return ''; };
      const attrOf = (names, at)=>{ for(let j=0;j<names.length;j++){ const els=node.getElementsByTagName(names[j]); for(let k=0;k<els.length;k++){ const v = els[k].getAttribute ? els[k].getAttribute(at) : null; if(v) return v; } } return ''; };
      const content = txt(['content:encoded','encoded','content']);
      const description = txt(['description','summary']);
      const guid = txt(['guid','id']);
      let link = txt(['link']);
      if(!link) link = attrOf(['link','guid','id'],'href') || guid;
      const html = (content||'') + ' ' + (description||'');
      let img = attrOf(['media:thumbnail','thumbnail'],'url') || attrOf(['media:content'],'url');
      if(!img){
        const encs = node.getElementsByTagName('enclosure');
        for(let k=0;k<encs.length;k++){
          const u = encs[k].getAttribute ? (encs[k].getAttribute('url')||'') : '';
          if(u && (/\.(jpg|jpeg|png|webp|gif)/i.test(u) || (encs[k].getAttribute('type')||'').indexOf('image')===0)){ img=u; break; }
        }
      }
      if(!img){
        const m = html.match(/<img[^>]+src=["']([^"']+)["']/i);
        if(m && m[1].indexOf('news.google.com')===-1) img = m[1];
      }
      return {
        title: txt(['title']),
        link: link,
        guid: guid || link,
        pubDate: txt(['pubDate','pubdate','published','updated','dc:date','date']),
        description: description,
        content: content,
        thumbnail: (img && /\.(jpg|jpeg|png|webp)/i.test(img)) ? img : '',
        enclosure: (img && !/\.(jpg|jpeg|png|webp)/i.test(img)) ? {link:img} : null
      };
    }).filter(it=>it.title);
  }

  function parseRssRegex(xmlText){
    const out=[];
    try{
      if(!xmlText || xmlText.indexOf('<')===-1) return out;
      const blocks = xmlText.match(/<item[\s>][\s\S]*?<\/item>/gi) || xmlText.match(/<entry[\s>][\s\S]*?<\/entry>/gi) || [];
      blocks.slice(0,40).forEach(block=>{
        const pick=(re)=>{ const m=block.match(re); return m ? m[1].trim() : ''; };
        const bukaCdata=(s)=>s.replace(/^<!\[CDATA\[/,'').replace(/\]\]>$/,'').trim();
        const decode=(s)=>s.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#0?39;|&apos;/g,"'");
        const title=decode(bukaCdata(pick(/<title[^>]*>([\s\S]*?)<\/title/i)));
        let link=decode(bukaCdata(pick(/<link[^>]*>([\s\S]*?)<\/link/i)));
        if(!link || !/^https?:/i.test(link)){
          const lm=block.match(/<link[^>]*href=["']([^"']+)["']/i);
          if(lm) link=lm[1];
        }
        const guid=decode(bukaCdata(pick(/<guid[^>]*>([\s\S]*?)<\/guid/i))) || decode(bukaCdata(pick(/<id[^>]*>([\s\S]*?)<\/id/i)));
        const pubDate=decode(bukaCdata(pick(/<pubDate[^>]*>([\s\S]*?)<\/pubDate/i))) || decode(bukaCdata(pick(/<published[^>]*>([\s\S]*?)<\/published/i))) || decode(bukaCdata(pick(/<updated[^>]*>([\s\S]*?)<\/updated/i))) || decode(bukaCdata(pick(/<dc:date[^>]*>([\s\S]*?)<\/dc:date/i)));
        const content=decode(bukaCdata(pick(/<content:encoded[^>]*>([\s\S]*?)<\/content:encoded/i)));
        const description=decode(bukaCdata(pick(/<description[^>]*>([\s\S]*?)<\/description/i)));
        const html=(content||'')+' '+(description||'');
        let img='';
        const tm=block.match(/<media:thumbnail[^>]*url=["']([^"']+)["']/i) || block.match(/<media:content[^>]*url=["']([^"']+)["']/i);
        if(tm) img=tm[1];
        if(!img){
          const em=block.match(/<enclosure[^>]*url=["']([^"']+)["']/i);
          if(em && (/\.(jpg|jpeg|png|webp|gif)/i.test(em[1]) || /type=["']image/i.test(em[0]))) img=em[1];
        }
        if(!img){
          const im=html.match(/<img[^>]+src=["']([^"']+)["']/i);
          if(im && im[1].indexOf('news.google.com')===-1) img=im[1];
        }
        out.push({
          title:title, link:link||guid, guid:guid||link, pubDate:pubDate,
          description:description, content:content,
          thumbnail:(img && /\.(jpg|jpeg|png|webp)/i.test(img)) ? img : '',
          enclosure:(img && !/\.(jpg|jpeg|png|webp)/i.test(img)) ? {link:img} : null
        });
      });
    }catch(e){}
    return out.filter(it=>it.title);
  }

  function rssProxyTargets(url){
    const enc = encodeURIComponent(url);
    return [
      {kind:'json', url:'https://api.rss2json.com/v1/api.json?rss_url='+enc},
      {kind:'xml',  url:'https://api.allorigins.win/raw?url='+enc},
      {kind:'wrap', url:'https://api.allorigins.win/get?url='+enc},
      {kind:'xml',  url:'https://cors.eu.org/'+url},
      {kind:'xml',  url:'https://api.codetabs.com/v1/proxy?quest='+enc}
    ];
  }

  function mapFeedItems(items, feed){
    return items.map((item,i)=>{
      const rawTitle = stripHtml(item.title||'');
      let title=rawTitle, source='';
      const dashIdx = rawTitle.lastIndexOf(' - ');
      if(dashIdx>15){ source=rawTitle.slice(dashIdx+3); title=rawTitle.slice(0,dashIdx); }
      if(!source) source=feed.name;
      const fullRaw = stripHtml(item.content||'');
      const descRaw = stripHtml(item.description||'');
      const desc = fullRaw.length > descRaw.length ? fullRaw : descRaw;
      const det = detectRegionAndCategory(title,desc);
      const d = item.pubDate ? new Date(item.pubDate) : new Date();
      const id = hashId(item.guid||item.link||title);
      const srcImg = extractImage(item);
      const topicImg = pickTopicPhoto(title, desc, det.category, id);
      return {
        id:id, title:title,
        deck:desc.slice(0,220)||title,
        content:desc||title,
        keyTakeaways:[],
        category:det.category, tags:[source],
        prov:det.prov, kota:det.kota||'', pulau:det.island,
        author:source,
        publishedAt:isNaN(d)?new Date().toISOString():d.toISOString(),
        readingTime:Math.max(1,Math.ceil((desc||title).split(/\s+/).length/180)),
        image:srcImg || topicImg,
        _topicImg:topicImg,
        views:0, likes:0, isLead:false, isBreaking:false,

  async function fetchFeed(feed){
    const targets = rssProxyTargets(feed.url);
    for(let i=0;i<targets.length;i++){
      const target = targets[i];
      try{
        const res = await fetchWithTimeout(target.url, 12000);
        if(!res || !res.ok) continue;
        if(target.kind==='json'){
          const data = await res.json();
          if(data && data.status==='ok' && data.items && data.items.length) return mapFeedItems(data.items, feed);
        }else if(target.kind==='xml'){
          const text = await res.text();
          if(text && text.indexOf('<')!==-1){
            const items = parseRssXml(text);
            if(items.length) return mapFeedItems(items, feed);
          }
        }else{
          const data = await res.json();
          const text = data && data.contents;
          if(text && text.indexOf('<')!==-1){
            const items = parseRssXml(text);
            if(items.length) return mapFeedItems(items, feed);
          }
        }
      }catch(e){ /* lanjut ke jembatan berikutnya */ }
    }
    return [];
  }

  async function loadRealNews(notify){
    setLoadingNews(true);
    let total=0, newest=null;
    try{
      const CHUNK = 4;
      for(let i=0;i<REAL_NEWS_FEEDS.length;i+=CHUNK){
        const chunk = REAL_NEWS_FEEDS.slice(i, i+CHUNK);
        const results = await Promise.allSettled(chunk.map(f=>fetchFeed(f)));
        const items = [];
        results.forEach(r=>{ if(r.status==='fulfilled' && r.value && r.value.length) items.push(...r.value); });
        if(items.length){
          items.sort((a,b)=>new Date(b.publishedAt)-new Date(a.publishedAt));
          const fresh = items.filter(a=>!realIdsRef.current.has(a.id));
          items.forEach(a=>realIdsRef.current.add(a.id));
          if(fresh.length){
            total += fresh.length;
            if(!newest || new Date(fresh[0].publishedAt) > new Date(newest.publishedAt)) newest = fresh[0];
            setRealArticles(prev=>[...fresh,...prev].sort((a,b)=>new Date(b.publishedAt)-new Date(a.publishedAt)).slice(0,60));
          }
        }
      }
    }catch(e){ /* tetap lanjut */ }
    setLoadingNews(false);
    if(!total){
      if(notify) alert('Gagal memuat berita terbaru. Periksa koneksi internet lalu coba lagi.');
      return;
    }
    setNotifications(prev=>[{id:'ntf-'+Date.now(),title:total+' berita terbaru masuk',text:newest.title,read:false},...prev].slice(0,40));
    if(notify){
      setToast(newest);
      const tid=newest.id;
      window.setTimeout(()=>setToast(cur=>(cur&&cur.id===tid)?null:cur),8000);
    }
  }

  /* ===== LINK SHARE ARTIKEL (satu sumber untuk semua tombol & kotak link) =====
     Format /b/<slug> dibaca middleware.js (Vercel) di sisi server untuk
     menyuntikkan meta foto + judul artikel ke bot WhatsApp/Facebook.
     ?v=7 = pemicu cache: membuat WhatsApp/Facebook mengambil meta TERBARU
     (foto pratinjau baru) alih-alih memakai pratinjau lama yang tersimpan.
     Naikkan angka ini (v=7, v=8, ...) bila suatu saat pratinjau lama masih
     muncul di medsos — link baru = WhatsApp/FB scrape ulang. */
  function shareLink(article){
    const key = (article && (article.slug || article.id)) || '';
    return window.location.origin + '/b/' + encodeURIComponent(key) + '?v=7#' + key;
  }
  function shareArticle(article){
    countShare(article.id);
    const url = shareLink(article);
    const text = article.title+'\n'+(article.deck||'');
    if(navigator.share){ navigator.share({title:article.title,text:text,url:url}).catch(()=>{}); }
    else if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text+'\n'+url).then(()=>alert('Link berita berhasil disalin!')).catch(()=>alert(url));
    } else alert(url);
  }
  /* ===== BAGIKAN KE PLATFORM TERTENTU =====
     Format link sama dengan tombol Bagikan (/b/slug?v=7) agar foto
     pratinjau WA/FB tetap tampil. Instagram tidak punya tombol bagikan web,
     jadi link disalin untuk ditempel di story/caption/bio. */
  function shareTo(platform, article){
    countShare(article.id);
    const url = shareLink(article);
    const text = article.title + '\n' + (article.deck||'');
    const enc = encodeURIComponent;
    if(platform==='wa'){ window.open('https://wa.me/?text='+enc(text+'\n'+url),'_blank','noopener'); }
    else if(platform==='fb'){ window.open('https://www.facebook.com/sharer/sharer.php?u='+enc(url),'_blank','noopener'); }
    else if(platform==='x'){ window.open('https://twitter.com/intent/tweet?text='+enc(article.title)+'&url='+enc(url),'_blank','noopener'); }
    else if(platform==='tg'){ window.open('https://t.me/share/url?url='+enc(url)+'&text='+enc(article.title),'_blank','noopener'); }
    else if(platform==='ig'){
      if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(()=>alert('Link berita disalin!\n\nBuka Instagram, lalu tempel di story, caption, atau bio kamu.')).catch(()=>alert(url)); }
      else alert(url);
    }
    else if(platform==='copy'){
      if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(()=>alert('Link berita berhasil disalin!')).catch(()=>alert(url)); }
      else alert(url);
    }
    else if(navigator.share){ navigator.share({title:article.title,text:text,url:url}).catch(()=>{}); }
  }

            <div data-region-menu className="absolute inset-x-3 top-full z-50 max-h-[65vh] overflow-y-auto rounded-2xl border border-mistDark bg-white shadow-2xl p-3 sm:inset-x-auto sm:right-6 sm:w-96 lg:right-8">

                    <button key={p} onClick={()=>chooseRegion(p)} className="w-full text-left px-3 py-2 rounded-xl hover:bg-mist text-xs text-ink">{p}</button>

                </div>
              ))}
            </div>

      {/* POPULAR REGIONS */}

            className={"shrink-0 px-3 py-1 rounded-full border text-[10px] font-bold "+(activeRegion==='Semua Daerah'?'bg-navy text-white border-navy':'bg-white border-mist hover:border-navy')}>Semua</button>

            <button key={region} onClick={()=>chooseRegion(region)}
              className={"shrink-0 px-3 py-1 rounded-full border text-[10px] font-bold "+(activeRegion===region?'bg-navy text-white border-navy':'bg-white border-mist hover:border-navy')}>{region}</button>
          ))}
        </div>
      </div>

      {/* RUNNING TEXT */}
      {tickerList.length>0 && (
        <div className="bg-brandred text-white flex items-stretch overflow-hidden">
          <div className="shrink-0 bg-brandred-dark flex items-center gap-1.5 px-3 sm:px-4">
            <span className="w-2 h-2 rounded-full bg-white live-dot"></span>
            <span className="text-[9px] sm:text-[10px] font-black tracking-widest">TERKINI</span>
          </div>
          <div className="ticker-wrap overflow-hidden flex-1">
            <div className="ticker-track py-2" style={{animationDuration:(Math.max(30,tickerList.length*9))+'s'}}>

                <div key={copy} className="flex shrink-0 items-center" aria-hidden={copy===1}>

                    <button key={copy+'-'+i+'-'+a.id} onClick={()=>openArticle(a)}

                      <span className="w-1 h-1 rounded-full bg-white/80 shrink-0"></span>
                      <span className="font-bold">{a.title}</span>
                      {a.external && <span className="text-white/75 text-[9px]">({a.author})</span>}
                    </button>
                  ))}
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      <main className="w-full max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-5 sm:py-8 space-y-8">

        {/* MOBILE SEARCH */}
        <div className="lg:hidden flex items-center border border-mistDark bg-white rounded-xl px-3">
          <span className="text-inklight mr-2">⌕</span>
          <input value={searchQuery} onChange={e=>setSearchQuery(e.target.value)} placeholder="Cari berita..." className="w-full py-2.5 bg-transparent outline-none text-sm" />

          {selectedIsland!=='Semua' && <span><span className="text-inklight">/</span> <span className="font-bold">{selectedIsland}</span></span>}
          {selectedTag && <span><span className="text-inklight">/</span> <span className="font-bold">#{selectedTag}</span></span>}

              <ArticleImg article={leadArticle}
                className="absolute inset-0 w-full h-full object-cover opacity-75 group-hover:scale-[1.03] transition-transform duration-700" />
              <div className="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent"></div>
              <div className="absolute inset-x-0 bottom-0 p-5 sm:p-8">
                <div className="flex flex-wrap gap-2 mb-3">
                  <span className="bg-brandred px-2 py-1 rounded text-[9px] font-black uppercase">{leadArticle.category}</span>
                  <span className="bg-white/90 text-ink px-2 py-1 rounded text-[9px] font-black uppercase">{leadArticle.author}</span>
                </div>
                <h2 className="font-serif font-black text-2xl sm:text-4xl lg:text-5xl leading-tight break-anywhere">{leadArticle.title}</h2>
                <p className="mt-3 text-sm sm:text-base text-[#DBE9F9] max-w-2xl break-anywhere">{leadArticle.deck}</p>
                <div className="mt-5 flex flex-wrap gap-3 text-[10px] text-[#B9D4F0]">
                  <span>{leadArticle.author}</span><span>•</span>
                  <span>{formatViews(getStats(leadArticle).views)} dibaca</span><span>•</span>
                  <span>{leadArticle.readingTime} menit baca</span>
                </div>
              </div>
            </article>

            <div className="grid sm:grid-cols-2 lg:grid-cols-1 gap-5">
              {secondaryArticles.map(a=>(
                <article key={a.id} onClick={()=>openArticle(a)}
                  className="group cursor-pointer grid grid-cols-[120px_1fr] sm:grid-cols-[180px_1fr] lg:grid-cols-[150px_1fr] gap-4 bg-white border border-mistDark rounded-2xl overflow-hidden shadow-[0_2px_12px_-6px_rgba(7,55,110,0.14)] hover:shadow-[0_12px_28px_-12px_rgba(7,55,110,0.32)] hover:-translate-y-0.5 transition-all">
                  <div className="h-full min-h-[140px] overflow-hidden">
                    <ArticleImg article={a} className="w-full h-full object-cover group-hover:scale-[1.04] transition-transform duration-500" />
                  </div>
                  <div className="p-3 sm:p-4 flex flex-col justify-center min-w-0">
                    <span className="text-[9px] font-black uppercase tracking-wider text-brandred">{a.category}</span>
                    <h3 className="font-serif font-black text-lg sm:text-xl leading-tight mt-1 break-anywhere text-navy">{a.title}</h3>
                    <p className="text-[11px] text-inkgray mt-2 line-clamp-2">{a.deck}</p>
                    <span className="text-[9px] text-inklight mt-3">{formatViews(getStats(a).views)} dibaca</span>
                  </div>
                </article>
              ))}
            </div>
          </section>
        ) : (
          <div className="py-20 text-center text-inkgray">Berita tidak ditemukan.</div>
        )}

        {/* KOTAK IKLAN — iklan selalu tampil di kotak khusus ini */}
        <IklanBox/>

        {/* ISLAND EXPLORER */}

          <div className="text-[10px] uppercase tracking-widest font-black text-brandred">Jelajah Indonesia</div>

          <div className="flex gap-2 overflow-x-auto no-scrollbar pb-2">
            <button onClick={()=>setSelectedIsland('Semua')}
              className={"shrink-0 px-4 py-2 rounded-xl border text-xs font-bold "+(selectedIsland==='Semua'?'bg-navy text-white':'bg-white border-mistDark')}>Semua Pulau</button>
            {Object.keys(INDONESIA_ISLANDS).map(i=>(
              <button key={i} onClick={()=>setSelectedIsland(i)}
                className={"shrink-0 px-4 py-2 rounded-xl border text-xs font-bold "+(selectedIsland===i?'bg-navy text-white':'bg-white border-mistDark')}>
                {i} <span className="opacity-50">({allArticles.filter(a=>a.pulau===i).length})</span>
              </button>
            ))}
          </div>
        </section>

        {/* FEED + SIDEBAR */}
        <section className="grid lg:grid-cols-[1fr_320px] gap-8">
          <div id="berita-terkini">
            <div className="flex items-center justify-between border-b border-mistDark pb-3 mb-4">
              <h2 className="font-serif text-2xl font-black">Berita Terkini</h2>
              <div className="flex items-center gap-2">
                {!hasActiveFilter && (
                  <button onClick={reshuffle}
                    className="text-[10px] px-2.5 py-1 rounded-full border border-mistDark bg-white font-bold hover:border-navy"
                    title="Acak ulang urutan berita">
                    🔀 Acak
                  </button>
                )}
                <button onClick={()=>loadRealNews(true)}
                  className="text-[10px] px-2.5 py-1 rounded-full border border-mistDark bg-white font-bold hover:border-navy">
                  {loadingNews?'⏳ Memuat':'⟳ Terbaru'}
                </button>
                <span className="text-[10px] text-inkgray">{displayList.length} berita</span>
              </div>
            </div>

            {loadingNews && realArticles.length===0 && (
              <div className="py-10 text-center text-inkgray text-sm">
                <span className="inline-block w-2 h-2 rounded-full bg-brandred live-dot mr-2"></span>
                Memuat berita terbaru dari sumber nasional…
              </div>
            )}

            <div className="space-y-5">
              {remainingArticles.map(a=>{
                const st = getStats(a);
                return (
                <article key={a.id} onClick={()=>openArticle(a)}
                  className="grid grid-cols-[110px_1fr] sm:grid-cols-[190px_1fr] gap-4 pb-5 border-b border-mist cursor-pointer group">
                  <div className="h-28 sm:h-32 rounded-2xl overflow-hidden bg-mist">
                    <ArticleImg article={a} className="w-full h-full object-cover group-hover:scale-[1.04] transition-transform" />
                  </div>
                  <div className="min-w-0">
                    <div className="flex flex-wrap gap-2 text-[9px] font-black uppercase">
                      <span className="text-brandred">{a.category}</span>
                      <span className="text-inklight">{a.prov}</span>
                      {a.external && <span className="text-inkgray normal-case">{a.author}</span>}
                    </div>
                    <h3 className="font-serif text-xl sm:text-2xl font-black leading-tight mt-1 break-anywhere text-navy">{a.title}</h3>
                    <p className="text-xs sm:text-sm text-inkgray mt-2 line-clamp-2">{a.deck}</p>
                    <div className="mt-3 text-[9px] text-inklight flex flex-wrap gap-2">
                      <span>{formatViews(st.views)} dibaca</span><span>•</span>
                      <span>♥ {formatViews(st.likes)}</span><span>•</span>
                      <span>💬 {st.comments}</span>
                    </div>
                  </div>
                </article>
              );})}
              {!loadingNews && remainingArticles.length===0 && (
                <div className="py-16 text-center text-inkgray">Tidak ada berita sesuai filter.</div>
              )}
            </div>
          </div>

          <aside className="space-y-5">
            <div className="bg-white border border-mistDark rounded-2xl p-4">
              <h3 className="font-serif text-xl font-black border-b border-mist pb-3 mb-3">Terpopuler</h3>
              <div className="space-y-4">
                {popularArticles.map((a,i)=>(
                  <button key={a.id} onClick={()=>openArticle(a)} className="w-full text-left flex gap-3 group">
                    <span className="font-serif text-3xl font-black text-[#B9D4F0]">{String(i+1).padStart(2,'0')}</span>
                    <div className="min-w-0">
                      <div className="text-[9px] uppercase font-black text-brandred">{a.category}</div>
                      <div className="font-serif font-black leading-tight group-hover:underline break-anywhere text-navy">{a.title}</div>
                      <div className="text-[9px] text-inklight mt-1">{formatViews(getStats(a).views)} dibaca</div>
                    </div>
                  </button>
                ))}
              </div>
            </div>
            <div className="bg-navy text-white rounded-2xl p-5">
              <div className="flex justify-center pb-3 border-b border-white/10">
                <AnimatedLogo src={LOCAL_ASSETS.logoFooter} fallback={LOCAL_ASSETS.logoUtama}
                  className="h-16 max-w-full" />
              </div>
              <h3 className="font-serif text-2xl font-black mt-3">Informasi Terpercaya</h3>
              <p className="text-xs text-[#B9D4F0] mt-2">Menyajikan berita aktual dari 38 provinsi dengan mengedepankan ketelitian dan keterbukaan.</p>
            </div>
          </aside>
        </section>
      </main>

      {/* FOOTER — LOGO ANIMASI */}
      <footer className="bg-navy-deep text-white mt-8">
        <div className="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-10 grid sm:grid-cols-2 lg:grid-cols-4 gap-8">
          <div className="sm:col-span-2">
            <AnimatedLogo src={LOCAL_ASSETS.logoFooter} fallback={LOCAL_ASSETS.logoUtama}
              className="h-20 sm:h-24 max-w-full" />
            <p className="text-[#B9D4F0] text-sm leading-relaxed mt-4 max-w-xl">
              Portal berita Indonesia yang menyajikan informasi aktual dari berbagai daerah dengan mengedepankan ketelitian, keberimbangan dan keterbukaan informasi.
            </p>
            <div className="mt-4 h-1 w-16 bg-brandred rounded-full"></div>
          </div>
          <div>
            <h4 className="font-bold text-sm mb-3">Navigasi</h4>
            <div className="space-y-2 text-xs text-[#BCCCDC]">
              {CATEGORIES.slice(1,7).map(c=>(
                <button key={c} onClick={()=>{setActiveCategory(c);window.scrollTo({top:0,behavior:'smooth'});}} className="block hover:text-white">{c}</button>
              ))}
            </div>
          </div>
          <div>
            <h4 className="font-bold text-sm mb-3">Redaksi</h4>
            <div className="space-y-2 text-xs text-[#B9D4F0]">
              <button onClick={()=>setShowRedaksi(true)} className="block text-left font-bold text-white hover:text-[#FF8A8E]">👥 Redaksi & Wartawan</button>
              <div>{SITE_AUTHOR}</div>
              <div>Pedoman Media Siber</div>
              <div>Kode Etik Jurnalistik</div>
              <div>Hak Cipta</div>
            </div>
          </div>
        </div>
        <div className="border-t border-white/10">
          <div className="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-4 text-[10px] text-[#8FB8E8]">
            © {new Date().getFullYear()} {SITE_NAME}. Seluruh hak cipta dilindungi. <span className="ml-2 text-[#8FB8E8]">saepul haris</span>
          </div>
        </div>
      </footer>

      {/* ===== HALAMAN ARTIKEL PENUH ===== */}
      {selectedArticle && (
        <div id="article-page" className="fixed inset-0 z-[100] bg-white overflow-y-auto"
          onScroll={e=>{
            const el=e.currentTarget;
            const max=el.scrollHeight-el.clientHeight;
            setReadPct(max>0?Math.min(100,Math.round((el.scrollTop/max)*100)):0);
          }}>
          <div className="sticky top-0 z-10 bg-white/95 backdrop-blur border-b border-mist shadow-[0_1px_0_rgba(7,55,110,0.06)]">
            <div className="max-w-3xl mx-auto px-4 h-14 sm:h-16 flex items-center justify-between">
              <button onClick={closeReader} className="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-mist/70 hover:bg-mist text-xs sm:text-sm font-bold text-navy hover:text-brandred transition-colors shrink-0">
                <span className="text-base leading-none">←</span> Kembali
              </button>
              <AnimatedLogo src={LOCAL_ASSETS.logoUtama} fallback={LOCAL_ASSETS.logo}
                className="h-9 sm:h-11 max-w-[38vw] mx-2" />
              <div className="flex items-center gap-1.5 shrink-0">
                <button onClick={()=>shareArticle(selectedArticle)} className="w-9 h-9 rounded-full bg-mist/70 hover:bg-mist flex items-center justify-center text-xs" title="Bagikan">↗</button>
                <button onClick={()=>speakArticle(selectedArticle)} className="w-9 h-9 rounded-full bg-mist/70 hover:bg-mist flex items-center justify-center text-xs" title="Dengarkan">{isReading?'⏹':'🔊'}</button>
                <button onClick={()=>toggleBookmark(selectedArticle.id)} className="w-9 h-9 rounded-full bg-mist/70 hover:bg-mist flex items-center justify-center text-xs" title="Simpan">{bookmarks.includes(selectedArticle.id)?'🔖':'📑'}</button>
              </div>
            </div>
            <div className="art-progress"><div style={{width:readPct+'%'}}></div></div>
          </div>

          <div className="max-w-3xl mx-auto px-4 py-6 sm:py-8 pb-24">
            <div className="page-in">
            <div className="flex flex-wrap items-center gap-2">
              <span className="px-2.5 py-1 rounded-md bg-brandred text-white text-[9px] sm:text-[10px] font-black uppercase tracking-widest">{selectedArticle.category}</span>
              <span className="px-2.5 py-1 rounded-md border border-mistDark text-[9px] sm:text-[10px] font-bold uppercase tracking-widest text-inkgray bg-mist/50">{selectedArticle.prov}</span>
              {selectedArticle.external && <span className="px-2 py-0.5 rounded bg-navy text-white text-[9px] font-black uppercase tracking-widest">{selectedArticle.author}</span>}
            </div>

            <h1 className="font-serif text-[1.55rem] sm:text-4xl font-black leading-[1.25] break-anywhere mt-4 text-navy">
              {selectedArticle.title}
            </h1>
            <p className="mt-3 text-[15px] sm:text-lg text-inkgray leading-relaxed font-serif">{selectedArticle.deck}</p>

            <div className="mt-5 flex items-center gap-3 border-y border-mist py-4">
              <div className="w-10 h-10 rounded-full bg-gradient-to-br from-navy to-navy-light text-white flex items-center justify-center font-black text-sm shrink-0 ring-2 ring-brandred/20">
                {(selectedArticle.author||'R').charAt(0).toUpperCase()}
              </div>
              <div className="min-w-0">
                <div className="text-[13px] sm:text-sm font-bold break-anywhere">{selectedArticle.author}</div>
                <div className="text-[10px] sm:text-[11px] text-inklight mt-0.5">
                  {SITE_AUTHOR} • {selectedArticle.readingTime} menit baca{selectedArticle.publishedAt ? ' • '+tanggalIndoPendek(selectedArticle.publishedAt) : ''}
                </div>
              </div>
              <div className="ml-auto flex items-center rounded-full border border-mistDark bg-white overflow-hidden shrink-0" title="Atur ukuran teks">
                <button onClick={()=>setFontSize(x=>Math.max(14,x-1))} className="px-3 py-1.5 text-xs font-black text-inkgray hover:bg-mist hover:text-navy transition-colors" title="Perkecil teks">A−</button>
                <span className="px-1 text-[10px] font-black text-inklight border-x border-mist">{fontSize}px</span>
                <button onClick={()=>setFontSize(x=>Math.min(19,x+1))} className="px-3 py-1.5 text-xs font-black text-inkgray hover:bg-mist hover:text-navy transition-colors" title="Perbesar teks">A+</button>
              </div>
            </div>

            <figure className="mt-6">
              <div className="rounded-2xl sm:rounded-3xl overflow-hidden bg-mist shadow-[0_10px_30px_-12px_rgba(7,55,110,0.35)] ring-1 ring-black/5">
                <ArticleImg article={selectedArticle} className="w-full max-h-[440px] object-cover" />
              </div>
              <figcaption className="mt-2.5 text-[10px] sm:text-[11px] text-inklight flex items-center gap-1.5">
                <span className="w-1.5 h-1.5 rounded-full bg-brandred inline-block shrink-0"></span>
                Foto: {selectedArticle.external ? selectedArticle.author+' (sumber asli)' : SITE_AUTHOR}
              </figcaption>
            </figure>
            </div>

            <div className="mt-5 flex flex-wrap gap-2">
              <span className="px-3 py-1.5 rounded-full bg-mist/70 border border-mist text-[10px] sm:text-[11px] text-inkgray font-bold">👁 {formatViews(selStats.views)} dibaca</span>
              <span className="px-3 py-1.5 rounded-full bg-mist/70 border border-mist text-[10px] sm:text-[11px] text-inkgray font-bold">♥ {formatViews(selStats.likes)} suka</span>
              <span className="px-3 py-1.5 rounded-full bg-mist/70 border border-mist text-[10px] sm:text-[11px] text-inkgray font-bold">💬 {selComments.length} komentar</span>
              <span className="px-3 py-1.5 rounded-full bg-mist/70 border border-mist text-[10px] sm:text-[11px] text-inkgray font-bold">↗ {formatViews(selStats.shares)} dibagikan</span>
            </div>

            {selectedArticle.external && (
              <a href={selectedArticle.link} target="_blank" rel="noreferrer"
                className="mt-5 flex items-center justify-between bg-navy text-white rounded-xl px-4 py-3 text-xs font-bold hover:bg-navy-light">
                <span>Baca versi lengkap di {selectedArticle.author} ↗</span>
                <span>→</span>
              </a>
            )}

            {(selectedArticle.keyTakeaways||[]).length>0 && (
              <div className="mt-6 p-4 sm:p-5 rounded-2xl bg-white border border-mistDark border-l-4 border-l-brandred shadow-[0_4px_16px_-8px_rgba(7,55,110,0.18)]">
                <div className="flex items-center gap-2 mb-3">
                  <span className="w-5 h-5 rounded-md bg-brandred text-white flex items-center justify-center text-[10px] font-black shrink-0">!</span>
                  <div className="text-[10px] uppercase tracking-widest font-black text-navy">Poin Utama</div>
                </div>
                <ul className="space-y-2 text-[13px] sm:text-sm text-ink">
                  {selectedArticle.keyTakeaways.map((x,i)=>(
                    <li key={i} className="flex gap-2.5">
                      <span className="text-brandred font-black shrink-0">{i+1}.</span>
                      <span className="leading-relaxed">{x}</span>
                    </li>
                  ))}
                </ul>
              </div>
            )}

            <div className="mt-8">
              <ArticleBody content={selectedArticle.content} fontSize={fontSize} />
            </div>

            <div className="flex flex-wrap gap-2 mt-8 pt-6 border-t border-mist">
              {(selectedArticle.tags||[]).map(tag=>(
                <button key={tag} onClick={()=>{setSelectedTag(tag);closeReader();}} className="px-3.5 py-1.5 rounded-full bg-mist/70 border border-mist text-[11px] font-bold text-inkgray hover:bg-navy hover:text-white hover:border-navy transition-colors">#{tag}</button>
              ))}
            </div>

            <div className="flex flex-wrap items-center gap-2 mt-5">
              <button onClick={()=>toggleLike(selectedArticle.id)}
                className={"px-5 py-2.5 rounded-full text-xs font-bold transition-colors "+(likedIds.includes(selectedArticle.id)?'bg-brandred text-white shadow-[0_4px_12px_-4px_rgba(229,27,35,0.5)]':'bg-navy text-white hover:bg-navy-light')}>
                ♥ {likedIds.includes(selectedArticle.id) ? 'Disukai' : 'Suka'} ({formatViews(selStats.likes)})
              </button>
              <button onClick={()=>toggleBookmark(selectedArticle.id)} className="px-5 py-2.5 rounded-full border border-mistDark text-xs font-bold hover:border-navy hover:text-navy transition-colors">
                {bookmarks.includes(selectedArticle.id)?'🔖 Tersimpan':'🔖 Simpan'}
              </button>
              <button onClick={()=>shareArticle(selectedArticle)} className="px-5 py-2.5 rounded-full border border-mistDark text-xs font-bold hover:border-navy hover:text-navy transition-colors">
                ↗ Bagikan ({formatViews(selStats.shares)})

                </div>
              ))}
              <div className="pt-3 border-t border-mist text-[11px] text-inkgray space-y-1.5">
                <div>• Pedoman Media Siber</div>
                <div>• Kode Etik Jurnalistik</div>
                <div className="pt-1 break-anywhere">Seluruh konten {SITE_NAME} dikelola sesuai pedoman peliputan yang berlaku.</div>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* TOAST */}
      {toast && (
        <div className="fixed bottom-4 right-4 z-[300] toast-in">
          <button onClick={clickToast} className="bg-navy text-white rounded-2xl shadow-2xl p-4 max-w-xs text-left border border-white/10">
            <div className="text-[9px] uppercase tracking-widest font-black text-[#FF9B9E] mb-1 flex items-center gap-1.5">
              <span className="w-1.5 h-1.5 rounded-full bg-brandred live-dot"></span> Berita Baru Masuk
            </div>
            <div className="font-serif font-black leading-tight text-sm break-anywhere">{toast.title}</div>
            <div className="text-[10px] text-inklight mt-1">klik untuk baca →</div>
          </button>
        </div>
      )}

      {/* ===== NAVIGASI BAWAH (MOBILE) — Beranda, Terbaru, Simpan, Redaksi ===== */}
      <nav className="sm:hidden fixed bottom-0 inset-x-0 z-40 bg-navy border-t-[3px] border-brandred">
        <div className="grid grid-cols-4 text-white">
          <button onClick={()=>{resetFilters();window.scrollTo({top:0,behavior:'smooth'});}} className="flex flex-col items-center gap-0.5 py-2 text-[10px] font-bold active:bg-white/10">
            <span className="text-lg leading-none">🏠</span> Beranda
          </button>
          <button onClick={()=>{const el=document.getElementById('berita-terkini'); if(el) el.scrollIntoView({behavior:'smooth'});}} className="flex flex-col items-center gap-0.5 py-2 text-[10px] font-bold active:bg-white/10">
            <span className="text-lg leading-none">📰</span> Terbaru
          </button>
          <button onClick={()=>setShowBookmarks(true)} className="flex flex-col items-center gap-0.5 py-2 text-[10px] font-bold active:bg-white/10">
            <span className="text-lg leading-none">🔖</span> Simpan{bookmarks.length>0 ? ' ('+bookmarks.length+')' : ''}
          </button>
          <button onClick={()=>setShowRedaksi(true)} className="flex flex-col items-center gap-0.5 py-2 text-[10px] font-bold active:bg-white/10">
            <span className="text-lg leading-none">👥</span> Redaksi
          </button>
        </div>
      </nav>
      <div className="h-[62px] sm:hidden" aria-hidden="true"></div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Boundary><App /></Boundary>);
</script>
