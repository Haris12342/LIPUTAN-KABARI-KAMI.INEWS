/* =========================================================
   ★★ PARSER TOLERAN — PERBAIKI OTOMATIS KESALAHAN KETIK ★★
   Kalau blok data berita ada koma hilang / backtick tak
   tertutup / kurung kurang, berita TETAP DISELAMATKAN.
   ========================================================= */
function bacaField(chunk, field){
  try{
    const re = new RegExp('(?:^|[\\n\\r;,{}\\s])'+field+'\\s*[:=]\\s*','i');
    const m = chunk.match(re);
    if(!m) return '';
    let rest = chunk.slice(m.index + m[0].length).replace(/^[ \t]+/,'');
    const q = rest.charAt(0);
    if(q === '`' || q === '"' || q === "'"){
      const close = rest.indexOf(q, 1);
      if(close !== -1) return rest.slice(1, close).trim();
      /* nilai tidak ditutup → selamatkan sampai sebelum penutup objek */
      let v = rest.slice(1);
      v = v.replace(/[{}\[\];,\s]+$/g, '');
      return v.trim();
    }
    const nl = rest.search(/[\n\r}]/);
    return (nl === -1 ? rest : rest.slice(0, nl)).trim();
  }catch(e){ return ''; }
}
function parseBeritaToleran(raw){
  try{
    if(!raw) return [];
    const items = [];
    const re = /judul\s*[:=]/gi;
    const pos = [];
    let m;
    while((m = re.exec(raw)) !== null){ pos.push(m.index); }
    for(let p=0;p<pos.length;p++){
      const chunk = raw.slice(pos[p], p+1<pos.length ? pos[p+1] : raw.length);
      const it = {
        judul: bacaField(chunk,'judul'),
        tanggal: bacaField(chunk,'tanggal'),
        kategori: bacaField(chunk,'kategori'),
        foto: bacaField(chunk,'foto'),
        isi: bacaField(chunk,'isi')
      };
      if(it.judul) items.push(it);
    }
    return items;
  }catch(e){ return []; }
}

function matchTopic(title, deck, category){
  const text = ((category||'')+' '+(title||'')+' '+(deck||'')).toLowerCase();
  for(const [topic, words] of TOPIC_KEYWORDS){ if(words.some(w=>text.includes(w))) return topic; }
  const catMap = {'Olahraga':'Olahraga','Politik':'Politik','Ekonomi':'Ekonomi','Kesehatan':'Kesehatan','Pendidikan':'Pendidikan','Teknologi':'Teknologi','Lingkungan':'Lingkungan','Hukum':'Hukum','Gaya Hidup':'GayaHidup','Berita Desa':'Desa','Peristiwa':'Kota','Daerah':'Desa','Nasional':'Umum'};
  return catMap[category] || 'Umum';
}
function pickTopicPhoto(title, deck, category, seed){
  const topic = matchTopic(title, deck, category);
  const pool = TOPIC_PHOTOS[topic] || TOPIC_PHOTOS.Umum;
  const s = String(seed||title||'x');
  let h=0; for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))>>>0; }
  return pool[h % pool.length];
}

function fotoPath(f){
  /* Bersihkan karakter tak terlihat (sering ikut ter-copy dari WhatsApp/chat)
     yang membuat URL foto menjadi 404 — URL "sedikit kotor" tetap berfungsi. */
  let s = String(f||'');
  s = s.replace(/[\u200B-\u200F\u2060-\u2064\uFEFF\u00AD\u180E\u202A-\u202E\u2066-\u206F]/g,'');
  s = s.replace(/%E2%80%8B|%E2%80%8C|%E2%80%8D|%E2%81%A0|%EF%BB%BF|%C2%AD|%E2%80%AE/gi,'');
  s = s.trim().replace(/[\t\r\n]+/g,'').replace(/ +/g,'%20');
  if(!s) return '';
  if(/^https?:\/\//i.test(s)) return s;
  if(s.indexOf('/') === 0 || s.indexOf('./') === 0) return s;
  return s.replace(/ /g, '%20');
}

function parseTanggalIndo(str){
  if(!str) return new Date().toISOString();
  const m = String(str).trim().match(/^(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})$/);
  if(m && BULAN_INDO[m[2].toLowerCase()]!==undefined){
    const d = new Date(Number(m[3]), BULAN_INDO[m[2].toLowerCase()], Number(m[1]), 8, 0);
    if(!isNaN(d)) return d.toISOString();
  }
  const d = new Date(str);
  return isNaN(d) ? new Date().toISOString() : d.toISOString();
}

/* Konversi item berita — dijaga agar item rusak pun tidak menjatuhkan aplikasi */
function convertBerita(item,i){
  if(!item) return null;

function detectRegionAndCategory(title,content){
  const text = (title+' '+(content||'')).toLowerCase();
  const rules = [
    ['Politik',['politik','pemilu','pilkada','dpr','presiden','partai','kpu','bawaslu']],
    ['Ekonomi',['ekonomi','bisnis','investasi','rupiah','pasar','perbankan','umkm']],
    ['Teknologi',['teknologi','digital','internet','aplikasi','ai','startup']],
    ['Hukum',['hukum','pengadilan','polisi','kejaksaan','kasus','tersangka','pidana']],
    ['Pendidikan',['pendidikan','sekolah','kampus','guru','siswa','universitas']],
    ['Kesehatan',['kesehatan','rumah sakit','dokter','obat','penyakit']],
    ['Olahraga',['olahraga','sepak bola','bola','badminton','basket','atlet']],
    ['Gaya Hidup',['gaya hidup','kuliner','wisata','fashion','hiburan']],
    ['Lingkungan',['lingkungan','banjir','sampah','hutan','cuaca','iklim']]
  ];
  let category='Nasional';
  for(const [cat,words] of rules){ if(words.some(w=>text.includes(w))){category=cat;break;} }
  for(const [isl,provinces] of Object.entries(INDONESIA_ISLANDS)){
    for(const p of provinces){ if(text.includes(p.toLowerCase())) return {prov:p,island:isl,category}; }
  }
  const aliases=[
    ['Tangerang','Banten','Jawa'],['Serang','Banten','Jawa'],['Pandeglang','Banten','Jawa'],
    ['Lebak','Banten','Jawa'],['Bandung','Jawa Barat','Jawa'],['Bekasi','Jawa Barat','Jawa'],
    ['Bogor','Jawa Barat','Jawa'],['Depok','Jawa Barat','Jawa'],['Semarang','Jawa Tengah','Jawa'],
    ['Surabaya','Jawa Timur','Jawa'],['Yogyakarta','DI Yogyakarta','Jawa'],['Jakarta','DKI Jakarta','Jawa'],
    ['Medan','Sumatera Utara','Sumatra'],['Makassar','Sulawesi Selatan','Sulawesi'],['Denpasar','Bali','Bali & Nusa Tenggara'],
    ['Gunung Sari','Banten','Jawa'],['Mauk','Banten','Jawa']
  ];
  for(const [city,p,isl] of aliases){ if(text.includes(city.toLowerCase())) return {prov:p,island:isl,kota:city,category}; }
  return {prov:'Nasional',island:'Nasional',category};
}

function hashStr(s){ let h=0; const t=String(s); for(let i=0;i<t.length;i++){ h=(h*31+t.charCodeAt(i))>>>0; } return h; }

function extractImage(item){
  if(item.thumbnail) return item.thumbnail;
  if(item.enclosure && item.enclosure.link && /\.(jpg|jpeg|png|webp|gif)/i.test(item.enclosure.link)) return item.enclosure.link;
  const html = (item.content||'') + ' ' + (item.description||'');
  const m = html.match(/<img[^>]+src=["']([^"']+)["']/i);
  if(m && m[1].indexOf('news.google.com')===-1) return m[1];
  const m2 = html.match(/https?:\/\/[^\s"'<>]+\.(?:jpg|jpeg|png|webp)/i);
  if(m2 && m2[0].indexOf('news.google.com')===-1) return m2[0];
  return '';
}

function baseStats(id){
  const h = hashStr(id);
  const views = 900 + (h % 15000);
  const likes = Math.max(12, Math.floor(views * (0.018 + ((h>>3) % 40)/1000)));
  const comments = 2 + ((h>>6) % 35);
  const shares = Math.max(4, Math.floor(likes * 0.25));
  return {views, likes, comments, shares};

const DEFAULT_ARTICLES = [...SEED_ARTICLES, ...INITIAL_ARTICLES];

/* ===== STORAGE v19 ===== */
const STORAGE = { articles:'inw_v19_articles', real:'inw_v19_real', bookmarks:'inw_v19_bookmarks', notifications:'inw_v19_notif', likes:'inw_v19_likes', engagement:'inw_v19_engagement', seedSync:'inw_v19_seedsync' };
function loadStorage(key,fallback){
  try{ const c=localStorage.getItem(key); if(c) return JSON.parse(c); }catch(e){}
  return fallback;
}
function saveStorage(key,value){ try{ localStorage.setItem(key,JSON.stringify(value)); }catch(e){} }
function safeGetSession(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } }
function safeSetSession(k,v){ try{ if(v) sessionStorage.setItem(k,v); else sessionStorage.removeItem(k); }catch(e){} }

function syncSeedsWithStorage(){
  const stored = loadStorage(STORAGE.articles, null);
  if(!stored || !Array.isArray(stored) || !stored.length){
    saveStorage(STORAGE.seedSync, SEED_FINGERPRINT);
    return { list: DEFAULT_ARTICLES, added: 0 };
  }
  const prevFp = loadStorage(STORAGE.seedSync, null);
  const fpChanged = prevFp !== SEED_FINGERPRINT;
  let list = stored.slice();
  let added = 0;
  SEED_ARTICLES.forEach(seed => {
    const idx = list.findIndex(a => a.id === seed.id);
    if(idx === -1){ list.push(seed); added++; }
    else if(fpChanged){
      list[idx] = Object.assign({}, list[idx], {
        title:seed.title, slug:seed.slug, deck:seed.deck, content:seed.content,
        keyTakeaways:seed.keyTakeaways, category:seed.category, tags:seed.tags,
        prov:seed.prov, kota:seed.kota, pulau:seed.pulau,
        publishedAt:seed.publishedAt, readingTime:seed.readingTime, image:seed.image
      });
    }
  });
  list = list.filter(a => !(a.id && String(a.id).indexOf('seed-')===0 && !SEED_IDS.has(a.id)));
  saveStorage(STORAGE.seedSync, SEED_FINGERPRINT);
  return { list, added };
}

function SafeImg(props){
  const chain = [...new Set([props.src, props.fallback, props.net].filter(Boolean))];
  if(!chain.length) return null;
  return (
    <img src={chain[0]} alt={props.alt||''} loading="lazy"
      referrerPolicy="no-referrer"
      className={props.className}
      onError={e=>{
        const t=e.currentTarget;
        const i = Number(t.dataset.i||0) + 1;
        if(i < chain.length && chain[i] !== t.getAttribute('src')){
          t.dataset.i = String(i);
          t.src = chain[i];
        } else { t.style.display='none'; }
      }} />
  );
}
function AnimatedLogo({ src, fallback, className }) {
  return (
    <span className={"logo-anim "+(className||'')}>
      <SafeImg src={src} fallback={fallback} net={LOGO_DARURAT}
        alt={SITE_NAME} className="h-full w-auto max-w-none object-contain object-left" />
    </span>
  );
}
function ArticleImg({ article, className }) {
  const topic = article._topicImg
    || pickTopicPhoto(article.title, article.deck, article.category, article.id);
  return (
    <SafeImg src={article.image} fallback={topic} net={netPhoto(article.id||article.title)}
      alt={article.title} className={className} />
  );
}

/* ===== KOTAK IKLAN — memindahkan banner iklan ke dalam kotak khusus di halaman ===== */
function IklanBox(){
  const ref = React.useRef(null);
  const [hasAd,setHasAd] = React.useState(null); /* null = sedang dicek, kotak tetap dirender */
  React.useEffect(()=>{
    let tries=0;
    const tick=()=>{
      tries++;
      try{
        const src=document.getElementById('iklan-sumber');
        const dst=ref.current;
        if(src&&dst&&src!==dst&&src.childNodes.length&&!dst.childNodes.length){
          while(src.firstChild){ dst.appendChild(src.firstChild); }
        }
      }catch(e){}
      const ok = !!(ref.current && ref.current.querySelectorAll('iframe,ins,img').length);
      if(ok||tries>=20){ setHasAd(ok); return; }
      setTimeout(tick,300);
    };
    tick();
  },[]);
  if(hasAd===false) return null; /* sembunyikan hanya bila dipastikan tidak ada iklan */
  return (
    <div className="w-full max-w-[336px] mx-auto">
      <div className="text-center text-[9px] font-black uppercase tracking-widest text-inklight mb-1.5">Iklan</div>
      <div ref={ref} className="ad-slot bg-white border border-mistDark rounded-2xl overflow-hidden flex items-center justify-center"></div>
    </div>
  );
}

      return (

}

      if(!data || data.status!=='ok' || !data.items || !data.items.length) return [];
      return data.items.map((item,i)=>{
        const rawTitle = stripHtml(item.title||'');
        let title=rawTitle, source='';
        const dashIdx = rawTitle.lastIndexOf(' - ');
        if(dashIdx>15){ source=rawTitle.slice(dashIdx+3); title=rawTitle.slice(0,dashIdx); }
        if(!source) source=feed.name;
        const fullRaw = stripHtml(item.content||'');
        const descRaw = stripHtml(item.description||'');
        const desc = fullRaw.length > descRaw.length ? fullRaw : descRaw;
        const det = detectRegionAndCategory(title,desc);
        const d = item.pubDate ? new Date(item.pubDate) : new Date();
        const id = hashId(item.guid||item.link||title);
        const srcImg = extractImage(item);
        const topicImg = pickTopicPhoto(title, desc, det.category, id);
        return {
          id:id, title:title,
          deck:desc.slice(0,220)||title,
          content:desc||title,
          keyTakeaways:[],
          category:det.category, tags:[source],
          prov:det.prov, kota:det.kota||'', pulau:det.island,
          author:source,
          publishedAt:isNaN(d)?new Date().toISOString():d.toISOString(),
          readingTime:Math.max(1,Math.ceil((desc||title).split(/\s+/).length/180)),
          image:srcImg || topicImg,
          _topicImg:topicImg,
          views:0, likes:0, isLead:false, isBreaking:false,
          external:true, link:item.link

      .sort((x,y)=>x.k-y.k).map(o=>o.a)
      .slice(0,3);

    function openArticle(article){
    if(window.speechSynthesis) window.speechSynthesis.cancel();
    setIsReading(false);
    setEngagement(prev=>Object.assign({}, prev, {
      [article.id]: Object.assign({}, prev[article.id]||{}, { views:((prev[article.id]||{}).views||0)+1 })
    }));
    setSelectedArticle(Object.assign({}, article));
    setCommentText('');
    try{
      history.replaceState(null,'','#'+(article.slug||article.id));
      document.title = article.title+' - '+SITE_NAME;
    }catch(e){}
  }
    function closeReader(){
    if(window.speechSynthesis) window.speechSynthesis.cancel();
    setIsReading(false);
    setSelectedArticle(null);
    try{
      history.replaceState(null,'',location.pathname + location.search);
      document.title = SITE_NAME+' - Portal Berita Nasional';
    }catch(e){}
  }

  /* Buka berita otomatis saat link bagikan diklik orang lain */
  useEffect(()=>{
    if(!allArticles.length || selectedArticle) return;
    const h = (window.location.hash||'').toLowerCase();
    let key = (h && h.length>=2) ? h.slice(1) : '';
    if(!key){
      try{ key = (new URLSearchParams(window.location.search||'').get('berita')||'').toLowerCase(); }catch(e){}
    }
    if(!key) return;
    const found = allArticles.find(a=>
      (a.id||'').toLowerCase()===key ||
      (a.slug||'').toLowerCase()===key ||
      (a.title||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')===key
    );
    if(found) openArticle(found);
  },[allArticles]);
  function toggleBookmark(id){
    setBookmarks(prev=>prev.includes(id)?prev.filter(x=>x!==id):[...prev,id]);
  }
  function toggleLike(id){
    const has=likedIds.includes(id);
    setLikedIds(prev=>has?prev.filter(x=>x!==id):[...prev,id]);
    setEngagement(prev=>{
      const cur = prev[id]||{};
      return Object.assign({}, prev, {
        [id]: Object.assign({}, cur, { likes: Math.max(0,(cur.likes||0)+(has?-1:1)) })
      });
    });
  }
  function addComment(id,text){
    if(!text.trim()) return;
    const comment={id:Date.now(),name:SITE_READER,text:text.trim(),createdAt:new Date().toISOString()};
    setEngagement(prev=>{
      const cur = prev[id]||{};
      return Object.assign({}, prev, {
        [id]: Object.assign({}, cur, { comments:[...(cur.comments||[]), comment] })
      });
    });
    setCommentText('');
  }
  function countShare(id){
    setEngagement(prev=>{
      const cur = prev[id]||{};
      return Object.assign({}, prev, {
        [id]: Object.assign({}, cur, { shares:(cur.shares||0)+1 })
      });
    });
  }
  function speakArticle(article){
    if(!('speechSynthesis' in window)){ alert('Browser belum mendukung fitur baca berita.'); return; }
    window.speechSynthesis.cancel();
    if(isReading){ setIsReading(false); return; }
    const u=new SpeechSynthesisUtterance(article.title+'. '+(article.deck||'')+'. '+(article.content||''));
    u.lang='id-ID'; u.rate=.95;
    u.onend=()=>setIsReading(false);
    u.onerror=()=>setIsReading(false);
    setIsReading(true);
    window.speechSynthesis.speak(u);
  }
  /* ===== LINK SHARE ARTIKEL (satu sumber untuk semua tombol & kotak link) =====
     Format /b/<slug> dibaca middleware.js (Vercel) di sisi server untuk
     menyuntikkan meta foto + judul artikel ke bot WhatsApp/Facebook.
     ?v=4 = pemicu cache: membuat WhatsApp/Facebook mengambil meta TERBARU
     (foto pratinjau baru) alih-alih memakai pratinjau lama yang tersimpan.
     Naikkan angka ini (v=5, v=6, ...) bila suatu saat pratinjau lama masih
     muncul di medsos — link baru = WhatsApp/FB scrape ulang. */
  function shareLink(article){
    const key = (article && (article.slug || article.id)) || '';
    return window.location.origin + '/b/' + encodeURIComponent(key) + '?v=4#' + key;
  }
  function shareArticle(article){
    countShare(article.id);
    const url = shareLink(article);
    const text = article.title+'\n'+(article.deck||'');
    if(navigator.share){ navigator.share({title:article.title,text:text,url:url}).catch(()=>{}); }
    else if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text+'\n'+url).then(()=>alert('Link berita berhasil disalin!')).catch(()=>alert(url));
    } else alert(url);
  }
  /* ===== BAGIKAN KE PLATFORM TERTENTU =====
     Format link sama dengan tombol Bagikan (/b/slug?v=4) agar foto
     pratinjau WA/FB tetap tampil. Instagram tidak punya tombol bagikan web,
     jadi link disalin untuk ditempel di story/caption/bio. */
  function shareTo(platform, article){
    countShare(article.id);
    const url = shareLink(article);
    const text = article.title + '\n' + (article.deck||'');
    const enc = encodeURIComponent;
    if(platform==='wa'){ window.open('https://wa.me/?text='+enc(text+'\n'+url),'_blank','noopener'); }
    else if(platform==='fb'){ window.open('https://www.facebook.com/sharer/sharer.php?u='+enc(url),'_blank','noopener'); }
    else if(platform==='x'){ window.open('https://twitter.com/intent/tweet?text='+enc(article.title)+'&url='+enc(url),'_blank','noopener'); }
    else if(platform==='tg'){ window.open('https://t.me/share/url?url='+enc(url)+'&text='+enc(article.title),'_blank','noopener'); }
    else if(platform==='ig'){
      if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(()=>alert('Link berita disalin!\n\nBuka Instagram, lalu tempel di story, caption, atau bio kamu.')).catch(()=>alert(url)); }
      else alert(url);
    }
    else if(platform==='copy'){
      if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(()=>alert('Link berita berhasil disalin!')).catch(()=>alert(url)); }
      else alert(url);
    }
    else if(navigator.share){ navigator.share({title:article.title,text:text,url:url}).catch(()=>{}); }
  }
  function openExternal(article){ window.open(article.link,'_blank','noopener'); }

    const existing=adminForm.id?localArticles.find(a=>a.id===adminForm.id):null;
    const data={
      id:adminForm.id||('art-'+Date.now()),
      title:adminForm.title.trim(),
      slug:adminForm.title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''),
      deck:adminForm.deck.trim()||adminForm.content.trim().slice(0,140),
      content:adminForm.content.trim(),
      keyTakeaways:adminForm.content.replace(/\n+/g,' ').split('.').map(x=>x.trim()).filter(Boolean).slice(0,3),
      category:adminForm.category||det.category,
      tags:adminForm.tags.split(',').map(x=>x.trim()).filter(Boolean),
      prov:adminForm.prov||det.prov,

      image:fotoPath(adminForm.image),
      isLead:!!adminForm.isLead, isBreaking:!!adminForm.isBreaking

    resetAdmin();

      {/* PANEL REDAKSI */}
      {showAdmin && unlocked && (
        <div className="fixed inset-0 z-[130] bg-black/60 p-2 sm:p-6 flex items-start sm:items-center justify-center overflow-y-auto" onClick={()=>setShowAdmin(false)}>
          <div className="w-full max-w-3xl bg-white rounded-2xl sm:rounded-3xl shadow-2xl my-4" onClick={e=>e.stopPropagation()}>
            <div className="flex items-center justify-between p-4 border-b border-mist">
              <h3 className="font-serif text-xl sm:text-2xl font-black">
                Panel Redaksi 🔒
                {adminForm.id && <span className="ml-2 text-[9px] bg-amber-200 text-amber-800 px-2 py-1 rounded align-middle">MODE EDIT</span>}
              </h3>
              <button onClick={()=>setShowAdmin(false)} className="w-9 h-9 rounded-lg bg-navy text-white text-lg leading-none">×</button>
            </div>

            <form onSubmit={e=>{e.preventDefault();saveArticle();}} className="p-4 sm:p-6 space-y-4">
              <label className="block">
                <span className="text-[10px] font-black uppercase tracking-widest text-inkgray">Judul Berita *</span>
                <input value={adminForm.title} onChange={e=>handleAdminInput('title',e.target.value)} placeholder="Tulis judul berita..."
                  className="mt-1 w-full border border-mistDark rounded-xl px-3 py-2 text-sm bg-white focus:outline-none focus:border-navy" />
              </label>
              <div className="grid sm:grid-cols-2 gap-3">
                <label className="block">
                  <span className="text-[10px] font-black uppercase tracking-widest text-inkgray">Kategori</span>
                  <select value={adminForm.category} onChange={e=>handleAdminInput('category',e.target.value)} className="mt-1 w-full border border-mistDark rounded-xl px-3 py-2 text-sm bg-white">
                    {ALL_CATEGORIES.filter(c=>c!=='Semua').map(c=><option key={c} value={c}>{c}</option>)}
                  </select>
                </label>
                <label className="block">
                  <span className="text-[10px] font-black uppercase tracking-widest text-inkgray">Provinsi</span>
                  <select value={adminForm.prov} onChange={e=>handleAdminInput('prov',e.target.value)} className="mt-1 w-full border border-mistDark rounded-xl px-3 py-2 text-sm bg-white">
                    <option value="Nasional">Nasional</option>
                    {ALL_PROVINCES.map(p=><option key={p} value={p}>{p}</option>)}
                  </select>
                </label>
              </div>
              <div className="grid sm:grid-cols-2 gap-3">
                <label className="block">
                  <span className="text-[10px] font-black uppercase tracking-widest text-inkgray">Kota</span>
                  <input value={adminForm.kota} onChange={e=>handleAdminInput('kota',e.target.value)} placeholder="cth: Tangerang" className="mt-1 w-full border border-mistDark rounded-xl px-3 py-2 text-sm bg-white" />
                </label>
                <label className="block">
                  <span className="text-[10px] font-black uppercase tracking-widest text-inkgray">Tag (pisahkan koma)</span>
                  <input value={adminForm.tags} onChange={e=>handleAdminInput('tags',e.target.value)} placeholder="Ekonomi, UMKM" className="mt-1 w-full border border-mistDark rounded-xl px-3 py-2 text-sm bg-white" />
                </label>
              </div>
              <label className="block">
                <span className="text-[10px] font-black uppercase tracking-widest text-inkgray">Ringkasan (Deck)</span>
                <textarea value={adminForm.deck} onChange={e=>handleAdminInput('deck',e.target.value)} rows={2} placeholder="Ringkasan singkat..." className="mt-1 w-full border border-mistDark rounded-xl px-3 py-2 text-sm bg-white" />
              </label>
              <label className="block">
                <span className="text-[10px] font-black uppercase tracking-widest text-inkgray">Isi Berita * (Enter 2x = paragraf baru, tampil lengkap)</span>
                <textarea value={adminForm.content} onChange={e=>handleAdminInput('content',e.target.value)} rows={10} placeholder="Tulis isi berita selengkap mungkin..." className="mt-1 w-full border border-mistDark rounded-xl px-3 py-2 text-sm bg-white" />
              </label>
              <div>
                <span className="text-[10px] font-black uppercase tracking-widest text-inkgray">Foto — nama file di folder yang sama, URL internet, atau kosongkan</span>
                <input value={adminForm.image} onChange={e=>handleAdminInput('image',e.target.value)} placeholder="Hut desa 43.jpg" className="mt-1 w-full border border-mistDark rounded-xl px-3 py-2 text-sm bg-white" />
              </div>
              <div className="flex flex-wrap items-center gap-4">
                <label className="flex items-center gap-2 text-xs font-bold">
                  <input type="checkbox" checked={adminForm.isBreaking} onChange={e=>handleAdminInput('isBreaking',e.target.checked)} className="w-4 h-4" />
                  Tandai BREAKING (masuk ticker)
                </label>
                <label className="flex items-center gap-2 text-xs font-bold">
                  <input type="checkbox" checked={adminForm.isLead} onChange={e=>handleAdminInput('isLead',e.target.checked)} className="w-4 h-4" />
                  Jadikan Berita Utama
                </label>
              </div>
              <div className="flex gap-2 pt-1">
                <button type="submit" className="flex-1 bg-navy text-white rounded-xl py-2.5 text-xs font-black">{adminForm.id?'Simpan Perubahan':'Terbitkan Berita'}</button>
                <button type="button" onClick={resetAdmin} className="px-4 rounded-xl border text-xs font-bold">Kosongkan</button>
              </div>
            </form>

            <div className="border-t border-mist p-4 sm:p-6">
              <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
                <h4 className="font-serif text-lg font-black">Kelola Berita ({localArticles.length})</h4>
                <div className="flex gap-2">
                  <button onClick={resetAllData} className="text-[10px] px-2.5 py-1.5 rounded-lg border border-mistDark font-bold hover:border-navy">⟲ Muat Ulang Data Awal</button>
                  <button onClick={exitAdminMode} className="text-[10px] px-2.5 py-1.5 rounded-lg bg-brandred text-white font-bold">Keluar Mode Redaksi</button>
                </div>
              </div>
              <div className="max-h-56 overflow-y-auto space-y-2">
                {localArticles.map(a=>(
                  <div key={a.id} className="flex items-center gap-2 bg-white rounded-xl border border-mist p-2">
                    <div className="w-12 h-9 rounded-lg overflow-hidden shrink-0 bg-mist">
                      <ArticleImg article={a} className="w-full h-full object-cover" />
                    </div>
                    <div className="flex-1 min-w-0 text-xs font-bold truncate">{a.title}</div>
                    <button onClick={()=>editArticle(a)} className="text-[10px] px-2.5 py-1 rounded-lg bg-navy text-white font-bold shrink-0">Edit</button>
                    <button onClick={()=>deleteArticle(a.id)} className="text-[10px] px-2.5 py-1 rounded-lg border border-mistDark font-bold shrink-0">Hapus</button>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      )}

      {/* NOTIFIKASI */}
      {showNotifications && (
        <div className="fixed inset-0 z-[120] bg-black/60 flex justify-end" onClick={()=>setShowNotifications(false)}>
          <aside className="w-full max-w-sm h-full bg-white shadow-2xl flex flex-col" onClick={e=>e.stopPropagation()}>
            <div className="flex items-center justify-between p-4 border-b border-mist">
              <h3 className="font-serif text-xl font-black">Notifikasi</h3>
              <div className="flex gap-2">
                <button onClick={clearNotifications} className="text-[10px] px-2.5 py-1.5 border border-mistDark rounded-lg font-bold">Bersihkan</button>
                <button onClick={()=>setShowNotifications(false)} className="w-8 h-8 rounded-lg bg-navy text-white text-lg leading-none">×</button>
              </div>
            </div>
            <div className="flex-1 overflow-y-auto p-4 space-y-3">
              {notifications.length===0 && <p className="text-xs text-inkgray">Belum ada notifikasi.</p>}
              {notifications.map(n=>(
                <div key={n.id} className={"p-3 rounded-xl border "+(n.read?'border-mist bg-white':'border-[#F3B8BA] bg-[#FDF2F2]')}>
                  <div className="text-[9px] font-black uppercase text-brandred">{n.title}</div>
                  <div className="text-sm font-bold mt-1 break-anywhere">{n.text}</div>
                </div>
              ))}
            </div>
          </aside>
        </div>
      )}

      {/* BOOKMARK */}
      {showBookmarks && (
        <div className="fixed inset-0 z-[120] bg-black/60 flex justify-end" onClick={()=>setShowBookmarks(false)}>
          <aside className="w-full max-w-sm h-full bg-white shadow-2xl flex flex-col" onClick={e=>e.stopPropagation()}>
            <div className="flex items-center justify-between p-4 border-b border-mist">
              <h3 className="font-serif text-xl font-black">Bookmark ({bookmarkedArticles.length})</h3>
              <button onClick={()=>setShowBookmarks(false)} className="w-8 h-8 rounded-lg bg-navy text-white text-lg leading-none">×</button>
            </div>
            <div className="flex-1 overflow-y-auto p-4 space-y-3">
              {bookmarkedArticles.length===0 && <p className="text-xs text-inkgray">Belum ada berita tersimpan.</p>}
              {bookmarkedArticles.map(a=>(
                <div key={a.id} className="flex gap-3 bg-white border border-mist rounded-xl p-2.5">
                  <div className="w-16 h-12 rounded-lg overflow-hidden shrink-0 bg-mist">
                    <ArticleImg article={a} className="w-full h-full object-cover" />
                  </div>
                  <button onClick={()=>{setShowBookmarks(false);openArticle(a);}} className="flex-1 min-w-0 text-left">
                    <div className="text-[9px] font-black uppercase text-brandred">{a.category}</div>
                    <div className="font-serif font-black text-sm leading-tight break-anywhere">{a.title}</div>
                  </button>
                  <button onClick={()=>toggleBookmark(a.id)} className="text-xs px-2 self-start text-inklight hover:text-brandred">✕</button>
                </div>
              ))}
            </div>
          </aside>
        </div>
      )}

      {/* ===== MODAL REDAKSI & WARTAWAN ===== */}
      {showRedaksi && (
        <div className="fixed inset-0 z-[140] bg-black/60 flex items-end sm:items-center justify-center sm:p-4" onClick={()=>setShowRedaksi(false)}>
          <div className="w-full sm:max-w-md bg-white rounded-t-3xl sm:rounded-3xl shadow-2xl overflow-hidden" onClick={e=>e.stopPropagation()}>
            <div className="bg-navy px-5 py-4 flex items-center justify-between">
              <div>
                <div className="text-[9px] uppercase tracking-widest font-black text-[#FF9B9E]">{SITE_NAME}</div>
                <h3 className="font-serif text-xl font-black text-white">Redaksi & Wartawan</h3>
              </div>
              <button onClick={()=>setShowRedaksi(false)} className="w-9 h-9 rounded-lg bg-white/10 text-white text-lg leading-none">×</button>
            </div>
            <div className="p-5 space-y-3 max-h-[60vh] overflow-y-auto">
              {REDAKSI_DATA.map((r,i)=>(
                <div key={i} className="flex items-center gap-3 p-3 rounded-2xl border border-mist bg-white">
                  <div className="w-11 h-11 rounded-full bg-navy text-white flex items-center justify-center font-black shrink-0">{(r.nama||'R').charAt(0).toUpperCase()}</div>
                  <div className="min-w-0">
                    <div className="text-sm font-black text-ink break-anywhere">{r.nama}</div>
                    <div className="text-[11px] text-inkgray">{r.jabatan}</div>
                  </div>
                </div>
              ))}
              <div className="pt-3 border-t border-mist text-[11px] text-inkgray space-y-1.5">
                <div>• Pedoman Media Siber</div>
                <div>• Kode Etik Jurnalistik</div>
                <div className="pt-1 break-anywhere">Seluruh konten {SITE_NAME} dikelola sesuai pedoman peliputan yang berlaku.</div>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* TOAST */}
      {toast && (
        <div className="fixed bottom-4 right-4 z-[300] toast-in">
          <button onClick={clickToast} className="bg-navy text-white rounded-2xl shadow-2xl p-4 max-w-xs text-left border border-white/10">
            <div className="text-[9px] uppercase tracking-widest font-black text-[#FF9B9E] mb-1 flex items-center gap-1.5">
              <span className="w-1.5 h-1.5 rounded-full bg-brandred live-dot"></span> Berita Baru Masuk
            </div>
            <div className="font-serif font-black leading-tight text-sm break-anywhere">{toast.title}</div>
            <div className="text-[10px] text-inklight mt-1">klik untuk baca →</div>
          </button>
        </div>
      )}

      {/* ===== NAVIGASI BAWAH (MOBILE) — Beranda, Terbaru, Simpan, Redaksi ===== */}
      <nav className="sm:hidden fixed bottom-0 inset-x-0 z-40 bg-navy border-t-[3px] border-brandred">
        <div className="grid grid-cols-4 text-white">
          <button onClick={()=>{resetFilters();window.scrollTo({top:0,behavior:'smooth'});}} className="flex flex-col items-center gap-0.5 py-2 text-[10px] font-bold active:bg-white/10">
            <span className="text-lg leading-none">🏠</span> Beranda
          </button>
          <button onClick={()=>{const el=document.getElementById('berita-terkini'); if(el) el.scrollIntoView({behavior:'smooth'});}} className="flex flex-col items-center gap-0.5 py-2 text-[10px] font-bold active:bg-white/10">
            <span className="text-lg leading-none">📰</span> Terbaru
          </button>
          <button onClick={()=>setShowBookmarks(true)} className="flex flex-col items-center gap-0.5 py-2 text-[10px] font-bold active:bg-white/10">
            <span className="text-lg leading-none">🔖</span> Simpan{bookmarks.length>0 ? ' ('+bookmarks.length+')' : ''}
          </button>
          <button onClick={()=>setShowRedaksi(true)} className="flex flex-col items-center gap-0.5 py-2 text-[10px] font-bold active:bg-white/10">
            <span className="text-lg leading-none">👥</span> Redaksi
          </button>
        </div>
      </nav>
      <div className="h-[62px] sm:hidden" aria-hidden="true"></div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Boundary><App /></Boundary>);
</script>
